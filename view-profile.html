<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View a friend's profile and posts on Near.">
    <meta name="theme-color" content="#f5f3ef">
    <title>Near — Friend Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navigation.css">
    <script type="module" src="navigation.js"></script>
    <script type="module" src="view-profile.js"></script>
</head>
<body>
    <main class="page-container">
        <header class="site-header">
            <a class="brand" href="index.html" aria-label="Near home">Near</a>
        </header>

        <section id="view-profile-page" class="card dashboard-card hidden" aria-labelledby="friend-profile-name">
            <div data-shared-navigation data-page="friends"></div>

            <h1 id="friend-profile-name">Loading profile...</h1>

            <p id="friend-posts-status" role="status" aria-live="polite">
                Loading posts...
            </p>

            <div id="friend-profile-posts" class="feed-posts"></div>

            <p id="view-profile-message" class="message" role="status" aria-live="polite"></p>

            <p>
                <a class="button button-secondary" href="friends.html">Back to friends</a>
            </p>
        </section>
    </main>
</body>
</html>
