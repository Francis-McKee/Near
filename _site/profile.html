
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Near profile and posts.">
    <meta name="theme-color" content="#f5f3ef">
    <title>Near — Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navigation.css">
    <script type="module" src="navigation.js"></script>
    <script type="module" src="profile.js"></script>
</head>
<body>
    <main class="page-container">
        <header class="site-header">
            <a class="brand" href="index.html" aria-label="Near home">Near</a>
            <p class="brand-subtitle">Stay connected, intentionally.</p>
        </header>

        <section id="profile-page" class="card dashboard-card hidden" aria-labelledby="profile-heading">
            <div data-shared-navigation data-page="profile"></div>

            <div class="dashboard-header">
                <div>
                    <p class="eyebrow">Your space</p>
                    <h1 id="profile-heading">Your profile</h1>
                </div>
            </div>

            <section class="friend-section" aria-labelledby="profile-details-heading">
                <h2 id="profile-details-heading">About you</h2>
                <div class="profile-detail">
                    <span class="profile-detail-label">Display name</span>
                    <p id="profile-display-name" class="profile-detail-value">Loading...</p>
                </div>
            </section>

            <section class="friend-section" aria-labelledby="profile-posts-heading">
                <h2 id="profile-posts-heading">Your posts</h2>
                <p class="intro-text">Your posts will appear here.</p>
            </section>

            <section class="friend-section" aria-labelledby="profile-settings-heading">
                <h2 id="profile-settings-heading">Account settings</h2>
                <p class="intro-text">Manage your account details, password, and sign-in.</p>
                <a class="button button-secondary" href="settings.html">Open settings</a>
            </section>

            <p id="profile-message" class="message" role="status" aria-live="polite"></p>
        </section>

        <footer class="site-footer">
            <p>Built for connection, not endless scrolling.</p>
        </footer>
    </main>
</body>
</html>
